# Dovecot config snippet shipped by dsmr-checkpassword-dovecot.
#
# Adds a second `unix_listener` under `service auth` so the
# checkpassword-dovecot bridge — running as the vpopmail UID under
# qmail-submission — can reach dovecot's auth-client protocol and obtain
# authentication results from dovecot's chained passdbs (vpopmail SQL,
# /etc/dovecot/system-passwd, PAM).
#
# The default auth-client socket dovecot creates is mode 0600 owned by
# dovecot:root, which qmail-smtpd cannot read.  This listener is mode 0660
# owned by vpopmail:vchkpw — the same identity qmail-smtpd already runs as.
#
# Uses a unique listener name (auth-client-smtp) so it does not collide
# with any auth-userdb (userdb-only) socket configured elsewhere.

service auth {
  unix_listener auth-client-smtp {
    user  = vpopmail
    group = vchkpw
    mode  = 0660
  }
}
